aid: anywhere-real-estate
url: https://raw.githubusercontent.com/api-evangelist/anywhere-real-estate/refs/heads/main/apis.yml
name: Anywhere Real Estate
kind: company
description: 'Anywhere Real Estate Inc. (formerly Realogy Holdings Corp., NYSE: HOUS) is one of the largest
  residential real estate services companies in the United States, headquartered at 175 Park Avenue, Madison,
  New Jersey. It franchises and operates Better Homes and Gardens Real Estate, CENTURY 21, Coldwell Banker,
  Coldwell Banker Commercial, Corcoran, ERA and Sotheby''s International Realty; runs the Anywhere Advisors
  brokerage, the Anywhere Integrated Services title and settlement business, the Anywhere Leads referral
  network and Cartus relocation. Its own home page states that as of January 9, 2026 Anywhere Real Estate
  and Compass came together as Compass International Holdings. Unusually for a brokerage, Anywhere operates
  a genuine Apigee-backed developer portal at developers.anywhere.re that publicly lists 23 documented
  API products spanning MLS and listing data, marketing syndication, transactions, back office, leads,
  agent recruiting, earnest money, title settlement, relocation and user access. Anywhere is a RESO consumer
  rather than a RESO certificant: its MLS Data Service returns listings in "canonical RESO format" and
  its Master Data product uses RESO name space convention, but Anywhere appears nowhere in the RESO Certification
  Status directory. Access is licensed, not open — every specification, Postman collection and SDK page
  redirects anonymous visitors to login, and both sandbox and production access require an Anywhere review
  of up to two business days under a binding API Terms of Use and License Agreement.'
accessModel:
  pricing: enterprise
  onboarding: approval
  trial: false
  try_now: false
  public: false
  label: Enterprise · Approval required (portal signup, then Anywhere approval for sandbox and again for
    production)
  confidence: high
  source:
  - https://developers.anywhere.re/docs/how-it-works
  - https://developers.anywhere.re/terms-use-api-license-agreement
  generated: '2026-07-26'
  method: observed
image: https://developers.anywhere.re/sites/default/files/anywhere_favicon.png
