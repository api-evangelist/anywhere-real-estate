  name: Anywhere MLS Data Service API
  description: Endpoints for MLS listings data assembled by Anywhere's MLS Data Platform (MDP), which
    downloads, processes and enriches listings from multiple MLS sources. Returns listings in canonical
    RESO format enriched with media and open house data, real-time MLS events, MLS display rules and active/sold
    listing statistics. Component APIs named on the product page are mls, mls-display-rules, mls-listings-stats,
    mlsagent, mlsagentroster, mlsofficeroster and listingsdirect-event-processing.
