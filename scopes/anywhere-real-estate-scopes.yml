model: App ID URI
caution: >-
  Anywhere OAuth scopes are Azure/Okta-style App ID URIs — opaque identifiers for a REST
  API, NOT base URLs. The OAuth guide states verbatim "The App ID URI is a unique
  identifier for the REST API. It is not where the REST API is hosted." Probing
  https://btt.realogyfg.com/ does not resolve. Never treat a scope value as a host.
assignment: >-
  Scopes are granted per approved application ("Scope: Will be communicated in the final
  approval"). A developer cannot self-select scopes; the set is bound to the API products
  the application was approved for. Scope is passed to the Okta token endpoint as a
  space-separated list.
