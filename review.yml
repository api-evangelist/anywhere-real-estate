findings:
  developerPortal: https://developers.anywhere.re/
  developerPortalConfirmed: true
  developerPortalIsSelfServe: false
  apiProductsListedPublicly: 23
  openapiHarvested: false
  specsCount: 0
  downloadableContracts: >-
    NONE obtainable anonymously. OpenAPI definitions provably exist — the release notes
    repeatedly describe "Referralleads Open API Spec change in production" and
    "Referralsservice Open API Spec change in production" — but every /specification
    path redirects to /Login. No /openapi.json, /swagger.json, /api-docs or $metadata is
    served on any Anywhere host.
  harvestedArtifacts:
    - path: authentication/anywhere-real-estate-okta-prod-authorization-server.json
      type: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      sourceURL: https://realogy.okta.com/oauth2/aus7i8b1taFyPOEGc1t7/.well-known/oauth-authorization-server
      httpStatus: 200
      fetched: '2026-07-26'
      parses: true
    - path: authentication/anywhere-real-estate-okta-prod-openid-configuration.json
      type: OpenID Connect Discovery document
      sourceURL: https://realogy.okta.com/oauth2/aus7i8b1taFyPOEGc1t7/.well-known/openid-configuration
      httpStatus: 200
      fetched: '2026-07-26'
      parses: true
    - path: authentication/anywhere-real-estate-okta-nonprod-authorization-server.json
      type: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      sourceURL: https://realogy.oktapreview.com/oauth2/ausdtpyw647fbrcPi0h7/.well-known/oauth-authorization-server
      httpStatus: 200
      fetched: '2026-07-26'
      parses: true
  webhooks: >-
    No webhook documentation found. Several products advertise "real-time" delivery and
    an events posture (MLS Data Service "receive MLS events in real-time"; a component
    API named listingsdirect-event-processing "used for ingesting and sending messages to
    and from the DOT system"), and a Confluent Kafka operational dashboard page exists in
    the sitemap at HTTP 403. But no anonymous webhook reference, no AsyncAPI, no public
    broker endpoint.
  sdks: >-
    Each product page carries an SDK tab, but it is login-gated
    (/api-product/<slug>/sdk redirects to /Login). No public SDK repositories exist on
    either GitHub org.
  postman: >-
    Postman collections exist per product and are login-gated. The portal blog post
    "Test Anywhere APIs with Postman Collection" instructs developers to "Download
    Postman collection from the Essential Read section of API product" and to set
    "baseUrl= Application URL which you can get from the specification page on portal"
    — confirming base URLs are only disclosed after login.
  graphql: none found
  mcp: none found
  llmsTxt: none found
  securityTxt: none found
  statusPage: https://developers.anywhere.re/status
  changelog: >-
    https://developers.anywhere.re/release-notes — public, deep and current
    (Developer Portal 1.3.35, March 24, 2026), which is unusually strong disclosure for
    this sector.
  sandbox: >-
    A production-like sandbox environment is advertised and is a documented step in the
    onboarding flow, but it is reachable only after approval.

