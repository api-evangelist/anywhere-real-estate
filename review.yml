aid: anywhere-real-estate
name: Anywhere Real Estate
kind: company
homeMarket: United States
tier: brokerage
review:
  question: >-
    Does Anywhere Real Estate publish a reachable public developer surface, and is
    it RESO certified?
  answer: >-
    Yes to the developer surface, no to RESO certification. Anywhere runs a real,
    actively maintained developer portal at https://developers.anywhere.re/ that
    anonymously exposes 23 named API products with overviews, requirements and OAuth
    scopes. Every machine-readable artifact behind those products — specification,
    Postman collection, SDK, "Get Access" — is login-gated. Anywhere consumes and
    republishes RESO-shaped data but holds no RESO certification.
  date: '2026-07-26'
  reviewer: API Evangelist
  method: anonymous HTTP probing plus reading of the public portal pages

# =====================================================================
# THE SECTOR BLOCK: certification is not reachability
# =====================================================================
sectorPosture:
  homeMarket: United States
  valueChainPosition: >-
    Brokerage and franchisor. Anywhere sits between the MLSs (which it consumes from)
    and the agent/consumer (which it serves). It is not an MLS, not a portal, and not
    a data reseller — it is a licensee of MLS data that re-exposes a normalized version
    of that data to its own franchisees, brokerages, partners and vendors.

  reso:
    posture: >-
      RESO consumer, not a RESO certificant. Anywhere's MLS Data Service product page
      states verbatim that it lets you "Get listings data using canonical RESO format,
      enriched with images (media) and open house data" and "Get listings details in
      RESO format." The Anywhere Master Data (MDM) product page states verbatim that
      "The Listings APIs provide listings, images, and open house data in Real Estate
      Standards Organization (RESO) name space convention." No certification of any
      kind is claimed anywhere on the portal.
    certified: false
    certificationType: none
    dataDictionaryVersion: 'not stated — the portal never names a RESO Data Dictionary version'
    webApiCertified: false
    dataDictionaryCertified: false
    directoryEvidence: >-
      Fetched https://www.reso.org/certificates/ (HTTP 200, 2026-07-26; the page itself
      says "Data updated 07/24/2026"). The RESO Certification Status list contains 578
      organizations — 536 with MLS (M-prefix) UOIs, 40 Technology Company (T-prefix)
      UOIs and 2 Commercial (C-prefix) UOIs. Case-insensitive search of the rendered
      text for "Anywhere", "Realogy", "Coldwell", "Century 21", "Sotheby", "Corcoran",
      "Better Homes", "Cartus" and "NRT" returned ZERO matches. The directory carries a
      Brokerage section heading but no brokerage entries. Zillow appears (UOI T00000053,
      Passed Current) — a portal is certified; this brokerage is not.
    upi: >-
      No reference to the RESO Universal Property Identifier (UPI) or Universal Parcel
      Identifier anywhere on developers.anywhere.re. Grep across all 22 anonymously
      readable product pages for "UPI", "Universal Property" and "Universal Parcel"
      returned zero hits.
    odataMetadata: >-
      None. RESO Web API is OData, so a $metadata document would be the machine-readable
      contract. Probed https://developers.anywhere.re/$metadata (HTTP 404) and
      https://api.anywhere.re/mls/v1/$metadata (HTTP 401, application/json — the gateway
      is live but rejects anonymous callers). No $metadata document is obtainable.
    coverageCaveat: >-
      Even for a licensed consumer, RESO coverage is partial. The Master Data product
      page states: "Currently, the APIs provide listings for the 'AR_TMLS' source and
      the other MLS sources that are yet to update as 'on-boarded' status, iteratively
      in the future."
    note: >-
      This is the sector's central distinction made concrete in reverse. The usual case
      is "certified but not reachable." Anywhere is the mirror image: a documented,
      publicly browsable API catalogue with no certification at all, speaking RESO's
      vocabulary as a private convention rather than as a certified contract.

  accessGate:
    gate: application-approval
    gated: true
    openData: false
    whatADeveloperMustDo:
      - Register a free developer account at https://developers.anywhere.re/user/register
        and activate it by email link (or log in with an existing Anywhere ID).
      - Accept the binding API Terms of Use & License Agreement at
        https://developers.anywhere.re/terms-use-api-license-agreement (last updated
        May 19, 2025). It states "In order to access APIs, you are required to register
        and be approved for a developer account through the API Portal" and grants only
        a "limited, non-exclusive, revocable, non-assignable, non-sublicensable license
        to access and use (i) specific APIs approved by Anywhere and (ii) associated API
        Data for such approved APIs."
      - Register an application under My Apps, selecting an API product, an environment
        and a Company/Group/Team, then wait for Anywhere review. Verbatim from the How
        It Works page - "Your request for Sandbox access will undergo Anywhere approval
        process which may take up to 2 business days."
      - Repeat the approval for production - "Your request for Production access will
        undergo Anywhere approval process which may take up to 2 business days."
      - Comply with each product's Requirements section, which for every product means
        an Anywhere-issued API Key plus Okta client credentials plus a product-specific
        Okta scope.
    visibilityTiers: >-
      The portal defines three product labels verbatim - "Public: The API product is
      available to all users. Private: The API product is available to only Anywhere
      internal users. Partner: The API product is available to Anywhere internal users
      and select Anywhere partners." 22 of the 23 catalogued products are labelled
      Public; Anywhere Leads Engine is labelled Partner and its product page returns
      HTTP 403 to anonymous visitors.
    intendedAudience: >-
      The Terms state the APIs "are solely intended for use by developers requiring
      access to Anywhere APIs, and not for individual consumers." Product pages list the
      "Usable by" audience as the Anywhere brands (Better Homes and Gardens Real Estate,
      CENTURY 21, Coldwell Banker, Coldwell Banker Commercial, Corcoran Group, ERA,
      Sotheby's International Realty) plus "All Anywhere partners/vendors."
    notMembershipRequired: >-
      Recorded deliberately - this gate is NOT MLS membership and NOT an IDX/VOW licence.
      No IDX, VOW, MLS Grid, Bridge, Trestle or Spark reference appears anywhere on the
      portal. The gate is Anywhere's own commercial/franchise relationship plus a
      click-through API licence and a human approval step.
    openDataFinding: >-
      No open data. There is no unlicensed, publicly callable dataset. The only
      anonymously callable JSON on any Anywhere host is the WordPress REST API of the
      corporate marketing site (https://anywhere.re/wp-json/, HTTP 200,
      application/json) — a CMS surface, not a real estate data product, and deliberately
      NOT listed as an API in apis.yml.

  authModel:
    scheme: OAuth 2.0 client credentials (Okta) plus a separate Anywhere-issued API key
    documentation: https://developers.anywhere.re/docs/realogy-oauth
    identityProvider: Okta (realogy.okta.com production, realogy.oktapreview.com non-production)
    tokenEndpointProduction: https://realogy.okta.com/oauth2/aus7i8b1taFyPOEGc1t7/v1/token
    tokenEndpointNonProduction: https://realogy.oktapreview.com/oauth2/ausdtpyw647fbrcPi0h7/v1/token
    grantType: client_credentials
    headers: >-
      Two credentials are required on every call - "apiKey: {Api Key assigned to your
      application}" and "Authorization: Bearer {access_token}".
    openidConfigurationFetched: true
    scopesAreAppIdUris: >-
      Anywhere's scopes are Azure/Okta-style App ID URIs, and the OAuth guide warns
      explicitly "The App ID URI is a unique identifier for the REST API. It is not where
      the REST API is hosted." They must therefore NEVER be treated as base URLs.
    documentedScopes:
      - https://btt.realogyfg.com/dashapi
      - https://btt.realogyfg.com/datasyncapi
      - https://btt.realogyfg.com/corporatestaffapi
      - https://btt.realogyfg.com/transactionsapi
      - https://btt.realogyfg.com/dynamicsearchapi
      - https://btt.realogyfg.com/propertypromotionsapi
      - https://btt.realogyfg.com/analyticsapi
      - https://btt.realogyfg.com/securityapi
      - https://dataservices.eap.com/eaplistingsapi
      - https://api.realogy.com/leadrouterapi
      - https://api.realogy.com/iprospectapi
      - https://api.realogy.com/c2shinningcapi
      - https://api.realogy.com/referralleadsapi
      - https://api.realogy.com/reloauthorizationapi
      - https://api.realogy.com/realvitalizevendorsapi
      - https://api.realogy.com/settlementcompanycapabilityapi
      - https://api.anywhere.re/referralpartnerintegration
      - https://eps.nrtllc.com/securityapi
      - apim-listingextensions
    operationalRule: >-
      Verbatim from the OAuth guide - "Applications who fail to cache their access tokens
      and request new access tokens for every REST API call they make will have their
      access immediately suspended."

