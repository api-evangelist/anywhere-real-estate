summary: >-
  Anywhere publishes NO public API client SDK. Every API product page carries an SDK tab, but
  /api-product/<slug>/sdk redirects anonymous visitors to /Login, and neither GitHub
  organization contains a client library. What IS published publicly is (a) the Bespoke
  ("bspk") design system — four first-party npm packages of brand UI components — and (b) an
  API Key Rotator toolkit distributed as a downloadable zip plus public AWS Lambda extension
  layer ARNs. Neither is an API client library, so this repo emits a Packages pointer and
  deliberately does NOT emit an SDKs pointer.
