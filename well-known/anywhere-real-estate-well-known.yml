source: anonymous HTTP probes of every Anywhere API/portal/marketing host and the Okta authorization servers named in https://developers.anywhere.re/docs/realogy-oauth
summary: >-
  Anywhere serves no /.well-known/ documents of its own on any host it operates
  (api.anywhere.re, api.realogy.com, developers.anywhere.re, anywhere.re) — every
  probe returns 404. The provider's real, machine-readable discovery surface lives
  on its identity provider instead: Okta publishes RFC 8414 OAuth 2.0 Authorization
  Server Metadata and an OpenID Connect Discovery document for both the production
  and non-production Anywhere authorization servers, and all three were harvested
  verbatim. There is no security.txt (RFC 9116), no RFC 9727 /.well-known/api-catalog
  and no ai-plugin.json anywhere in the estate.
