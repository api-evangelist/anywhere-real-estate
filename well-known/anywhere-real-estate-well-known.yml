findings:
- Every /.well-known/ path Anywhere itself could serve returns 404; the only 200s in
  the whole estate are on the Okta identity provider.
- Because the Okta authorization server metadata is anonymously readable, the token
  endpoints, supported grant types, PKCE support and token endpoint auth methods are
  fully discoverable even though the API specifications are not.
